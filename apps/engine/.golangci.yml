run:
  timeout: 3m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gofmt
    - goimports
    - revive
    - gosec
    - sqlclosecheck
    - rowserrcheck
    - bodyclose
    - contextcheck
    - errorlint
    - nilnil
    - gocritic
    - misspell
    - unparam
    - unconvert
    - prealloc

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: false
  gosec:
    excludes:
      - G404 # non-crypto rand ok in tests

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec, errcheck, revive]