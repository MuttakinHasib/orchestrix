#:schema https://json.schemastore.org/air.json

root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
bin = "./tmp/api"
include_ext = ["go", "sql", "yaml", "toml"]
exclude_dir = ["tmp", "bin", "sqlc"]
delay = 500
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
