version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - revive
    - gosec
    - sqlclosecheck
    - rowserrcheck
    - bodyclose
    - contextcheck
    - errorlint
    - nilnil
    - gocritic
    - misspell
    - unparam
    - unconvert
    - prealloc

  settings:
    revive:
      rules:
        - name: exported
          disabled: false
    gosec:
      excludes:
        - G404 # non-crypto rand ok in tests

  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, revive]

formatters:
  enable:
    - gofmt
    - goimports