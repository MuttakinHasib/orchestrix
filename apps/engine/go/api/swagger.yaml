info:
  contact: {}
  description: |-
    Engineering work management and workflow automation API.
    .
    The engine is one implementation of the shared API contract
    (docs/project_overview.md §41); this document is generated
    from the Go handlers (make swagger) and synced to
    packages/api-contract/openapi.yaml.
  title: Orchestrix Engine API
  version: 0.1.0
paths:
  /api/v1/workspaces:
    get:
      description: |-
        The window is stable under concurrent writes; follow
        next_cursor until it is empty. search matches name and
        slug case-insensitively.
      parameters:
      - description: Page size; defaults to 50, capped at 100
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque continuation token from the previous page
        in: query
        name: cursor
        type: string
      - description: Case-insensitive substring match on name and slug
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_workspace.WorkspacePage'
        "400":
          description: invalid_limit or invalid_cursor
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
      summary: List workspaces
      tags:
      - workspaces
    post:
      consumes:
      - application/json
      description: |-
        Slug is derived from the name when omitted ("Acme Inc!"
        becomes "acme-inc"). Slugs are globally unique.
      parameters:
      - description: Workspace to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_workspace.CreateWorkspaceInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_workspace.Workspace'
        "400":
          description: invalid_json or validation_failed
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "409":
          description: conflict — slug already exists
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
      summary: Create a workspace
      tags:
      - workspaces
  /api/v1/workspaces/{workspace_id}:
    delete:
      parameters:
      - description: Workspace id (UUID)
        in: path
        name: workspaceID
        required: true
        type: string
      responses:
        "204":
          description: The workspace was deleted
        "400":
          description: invalid_id
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
      summary: Delete a workspace
      tags:
      - workspaces
    get:
      parameters:
      - description: Workspace id (UUID)
        in: path
        name: workspaceID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_workspace.Workspace'
        "400":
          description: invalid_id
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
      summary: Get a workspace
      tags:
      - workspaces
    patch:
      consumes:
      - application/json
      description: Only the fields present in the body change.
      parameters:
      - description: Workspace id (UUID)
        in: path
        name: workspaceID
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_workspace.UpdateWorkspaceInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_workspace.Workspace'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
      summary: Partially update a workspace
      tags:
      - workspaces
  /api/v1/workspaces/{workspace_id}/teams:
    get:
      description: |-
        The window is stable under concurrent writes; follow
        next_cursor until it is empty. search matches the team
        name case-insensitively.
      parameters:
      - description: Workspace id (UUID)
        in: path
        name: workspace_id
        required: true
        type: string
      - description: Page size; defaults to 50, capped at 100
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque continuation token from the previous page
        in: query
        name: cursor
        type: string
      - description: Case-insensitive substring match on name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_teams.TeamPage'
        "400":
          description: invalid_limit, invalid_cursor, or invalid_id
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
      summary: List teams
      tags:
      - teams
    post:
      consumes:
      - application/json
      description: The workspace must exist; the team is scoped to it.
      parameters:
      - description: Workspace id (UUID)
        in: path
        name: workspace_id
        required: true
        type: string
      - description: Team to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_teams.CreateTeamInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_teams.Team'
        "400":
          description: invalid_json, validation_failed, or invalid_id
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "404":
          description: workspace does not exist
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
      summary: Create a team
      tags:
      - teams
  /api/v1/workspaces/{workspace_id}/teams/{team_id}:
    delete:
      parameters:
      - description: Workspace id (UUID)
        in: path
        name: workspace_id
        required: true
        type: string
      - description: Team id (UUID)
        in: path
        name: team_id
        required: true
        type: string
      responses:
        "204":
          description: The team was deleted
        "400":
          description: invalid_id
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
      summary: Delete a team
      tags:
      - teams
    get:
      parameters:
      - description: Workspace id (UUID)
        in: path
        name: workspace_id
        required: true
        type: string
      - description: Team id (UUID)
        in: path
        name: team_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_teams.Team'
        "400":
          description: invalid_id
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
      summary: Get a team
      tags:
      - teams
    patch:
      consumes:
      - application/json
      description: Only the fields present in the body change.
      parameters:
      - description: Workspace id (UUID)
        in: path
        name: workspace_id
        required: true
        type: string
      - description: Team id (UUID)
        in: path
        name: team_id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_teams.UpdateTeamInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_teams.Team'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
      summary: Partially update a team
      tags:
      - teams
  /healthz:
    get:
      description: The process is up; no dependencies are checked.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - system
  /readyz:
    get:
      description: Checks that dependencies (currently PostgreSQL) are reachable.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: unavailable
          schema:
            $ref: '#/definitions/github_com_MuttakinHasib_orchestrix_apps_engine_go_internal_httpx.Error'
      summary: Readiness probe
      tags:
      - system
swagger: "2.0"
