services:
  postgres:
    image: postgres:17-alpine
    container_name: orchestrix-postgres
    environment:
      POSTGRES_USER: orchestrix
      POSTGRES_PASSWORD: orchestrix
      POSTGRES_DB: orchestrix
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrix -d orchestrix"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: orchestrix-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
